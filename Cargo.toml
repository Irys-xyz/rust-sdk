[package]
name = "irys-sdk"
description = "Irys Network Rust SDK"
homepage = "https://irys.xyz"
version = "0.1.1"
edition = "2021"
repository = "https://github.com/Irys-xyz/rust-sdk"
readme = "README.md"
license = "Apache-2.0"

exclude = [
    ".cargo-husky",
    "res",
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    "bundles.ts",
    ".github",
    "release.toml",
]

[dependencies]
anyhow = "1.0.102"
async-recursion = "1.1.1"
async-stream = "0.3.6"
async-trait = "0.1.89"
avro-rs = "0.13.0"
arweave-rs = { version = "0.2.0", optional = true }
bs58 = "0.5.1"
bytes = "1.11.1"
clap = { version = "4.6.0", features = ["derive", "env"], optional = true }
data-encoding = "2.10.0"
derive_builder = "0.20.2"
derive_more = { version = "2.1.1", features = ["display", "error"] }
ed25519-dalek = { version = "2.2.0", optional = true }
futures = "0.3.32"
indexmap = "2.13.0"
lazy_static = "1.5.0"
logos = "0.16.1"
mime_guess = "2.0.5"
num = "0.4"
num-derive = "0.4"
num-traits = "0.2.19"
pipe = "0.4.0"
primitive-types = "0.14.0"
rand = "0.9.0"
regex = "1.12.3"
reqwest = { version = "0.11.20", default-features = false, features = [
    "rustls-tls",
    "json",
] }
ring = "0.17.14"
rustc-hex = "2.1.0"
secp256k1 = { version = "0.22.1", optional = true, features = ["recovery"] }
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10.9"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["fs"] }
tokio-util = "0.7.18"
validator = { version = "0.16", features = ["derive"] }
web3 = { version = "0.19.0", optional = true, default-features = false, features = [
    "http-rustls-tls",
    "signing",
] }

[dev-dependencies]
tokio-test = "0.4.5"
httpmock = "0.8"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

[features]
default = [
    "solana",
    "ethereum",
    "erc20",
    "cosmos",
    "arweave",
    "algorand",
    "aptos",
]
arweave = ["arweave-rs"]
cosmos = ["secp256k1"]
erc20 = ["secp256k1", "web3"]
ethereum = ["secp256k1", "web3"]
solana = ["ed25519-dalek"]
algorand = ["ed25519-dalek"]
aptos = ["ed25519-dalek"]
build-binary = ["clap"]

[[bin]]
name = "cli"
path = "src/client/bin/cli.rs"
required-features = ["build-binary"]
